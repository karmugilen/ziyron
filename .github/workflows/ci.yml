name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile everything, including tests
        run: cargo check --workspace --all-targets --locked
      - name: Test parsing and the command-line tool
        run: cargo test -p ziyron-meta -p ziyron-cli --locked
