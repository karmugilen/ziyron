[workspace]
resolver = "2"
members = [
    "crates/ziyron-types",
    "crates/ziyron-meta",
    "crates/ziyron-wire",
    "crates/ziyron-discovery",
    "crates/ziyron-core",
    "crates/ziyron-storage",
    "crates/ziyron-policy",
    "crates/ziyron-engine",
    "crates/ziyron-parity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
ziyron-types = { path = "crates/ziyron-types" }
ziyron-meta = { path = "crates/ziyron-meta" }
ziyron-wire = { path = "crates/ziyron-wire" }
ziyron-discovery = { path = "crates/ziyron-discovery" }
ziyron-core = { path = "crates/ziyron-core" }
ziyron-storage = { path = "crates/ziyron-storage" }
ziyron-policy = { path = "crates/ziyron-policy" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
parking_lot = "0.12"
tracing = "0.1"
futures = "0.3"
libc = "0.2"
hex = "0.4"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind: a panic in one background task must not kill the Android process.
panic = "unwind"
strip = true

[profile.bench]
debug = true

# Keep build output small: 9 workers build in parallel on one disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
