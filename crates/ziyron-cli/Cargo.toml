[package]
name = "ziyron-cli"
description = "Download and stream torrents from the command line."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "ziyron"
path = "src/main.rs"

[dependencies]
ziyron-engine.workspace = true
ziyron-meta.workspace = true
tokio.workspace = true
serde_json.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
